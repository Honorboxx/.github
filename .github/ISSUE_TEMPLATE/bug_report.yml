name: Bug report
description: Something in the engine, storefront builder, or fulfillment isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a **checkout or delivery problem with a purchase you made**, use the "Delivery / support" template instead. For a **security issue**, do not file here — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, and what went wrong?
      placeholder: Ran `node scripts/build.js` and…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands or clicks. A minimal repro gets fixed fastest.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Node version / commit
      description: "`node -v` and the repo commit or release you're on"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Error text or logs. Redact any secrets, tokens, or emails.
      render: shell
    validations:
      required: false
